name: Build Kernel

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  SUBARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  KBUILD_BUILD_USER: GitHub
  KBUILD_BUILD_HOST: Actions

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: sixteen-suki
          submodules: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            kmod cpio rsync unzip curl zip \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3 mkbootimg

      - name: Cache Clang toolchain (clang-r547379)
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: android-clang/clang-r547379
          key: clang-r547379

      - name: Download Clang clang-r547379
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p android-clang/clang-r547379
          curl -L --fail \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C android-clang/clang-r547379
          rm clang.tar.gz

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Build kernel
        env:
          CLANG_DIR: ${{ github.workspace }}/android-clang/clang-r547379/bin
        run: |
          set -euo pipefail
          export PATH="$CLANG_DIR:$PATH"
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"

          echo "clang: $(command -v clang)"
          clang --version
          echo "aarch64-linux-gnu-gcc: $(command -v aarch64-linux-gnu-gcc)"
          echo "arm-linux-gnueabi-ld: $(command -v arm-linux-gnueabi-ld)"

          MAKE_ARGS="ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"

          echo "::group::Setting defconfig"
          make $MAKE_ARGS neptune_defconfig
          echo "::endgroup::"

          echo "::group::Compiling kernel"
          make $MAKE_ARGS -j"$(nproc --all)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "::endgroup::"

      - name: Verify output
        run: |
          test -f arch/arm64/boot/Image.gz-dtb || { echo "::error::Image.gz-dtb not found"; exit 1; }
          ls -lh arch/arm64/boot/Image.gz-dtb

      - name: Repack boot.img with new kernel
        run: |
          echo "::group::Downloading stock image"
          curl -L --fail "https://mirror.codebucket.de/yaap/guacamole/20260522/boot.img" -o boot.img
          echo "::endgroup::"
          
          echo "::group::Repacking boot.img"
          echo "Extracting ramdisk"
          python3 - <<'EOF'
          import struct
          with open('boot.img', 'rb') as f:
              data = f.read()
          page_size = struct.unpack('<I', data[36:40])[0]
          kernel_size = struct.unpack('<I', data[8:12])[0]
          ramdisk_size = struct.unpack('<I', data[16:20])[0]
          def pages(n, p): return (n + p - 1) // p
          ramdisk_offset = page_size + pages(kernel_size, page_size) * page_size
          with open('ramdisk.img', 'wb') as f:
              f.write(data[ramdisk_offset:ramdisk_offset + ramdisk_size])
          EOF

          echo "Creating new boot image"
          mkbootimg \
            --header_version 1 \
            --kernel arch/arm64/boot/Image.gz-dtb \
            --ramdisk ramdisk.img \
            --base 0x00000000 --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 --tags_offset 0x00000100 \
            --pagesize 4096 \
            --os_version "16.0.0" --os_patch_level "2026-05" \
            --cmdline "androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=2048 loop.max_part=7 androidboot.usbcontroller=a600000.dwc3 kpti=off androidboot.vbmeta.avb_version=1.0 buildvariant=user" \
            --output boot-suki.img
          echo "::endgroup::"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb-${{ github.sha }}
          path: arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-suki.img 
          path: boot-suki.img
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: warn
